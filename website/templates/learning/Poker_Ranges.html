    // ─── Utilities ───
    function handName(i, j) {
        if (i === j) return RANKS[i] + RANKS[j];
        if (i < j)  return RANKS[i] + RANKS[j] + 's';
        return RANKS[j] + RANKS[i] + 'o';
    }

    function handCombos(hand) {
        if (hand.length === 2) return 6;
        return hand.endsWith('s') ? 4 : 12;
    }

    function rangeKey() {
        if (state.scenario === 'rfi') return state.position;
        return state.responderPos + '_vs_' + state.openerPos;
    }

    function currentRange() {
        return rangeData[state.scenario][rangeKey()] || {};
    }

    function handActions(hand) {
        const rng = currentRange();
        if (state.scenario === 'rfi') {
            const r = rng[hand] || 0;
            return { r, c: 0, f: 100 - r };
        }
        const d = rng[hand];
        if (!d) return { r: 0, c: 0, f: 100 };
        const r = d.r || 0, c = d.c || 0;
        return { r, c, f: Math.max(0, 100 - r - c) };
    }

    function calcStats() {
        let tot = 0, rr = 0, cc = 0, ff = 0;
        for (let i = 0; i < 13; i++) {
            for (let j = 0; j < 13; j++) {
                const h = handName(i, j);
                const n = handCombos(h);
                const a = handActions(h);
                tot += n;
                rr += n * a.r / 100;
                cc += n * a.c / 100;
                ff += n * a.f / 100;
            }
        }
        return {
            total: tot,
            raise: rr,  raisePct: rr / tot * 100,
            call:  cc,  callPct:  cc / tot * 100,
            fold:  ff,  foldPct:  ff / tot * 100
        };
    }

    // ─── Range Text Parser ───
    function expandPairs(hi, lo) {
        const a = RANK_IDX[hi], b = RANK_IDX[lo];
        const out = [];
        for (let i = Math.min(a,b); i <= Math.max(a,b); i++) out.push(RANKS[i]+RANKS[i]);
        return out;
    }

    function expandSuited(r1, hiR2, loR2) {
        const a = RANK_IDX[hiR2], b = RANK_IDX[loR2];
        const out = [];
        for (let i = Math.min(a,b); i <= Math.max(a,b); i++) {
            if (RANKS[i] !== r1) out.push(r1 + RANKS[i] + 's');
        }
        return out;
    }

    function expandOffsuit(r1, hiR2, loR2) {
        const a = RANK_IDX[hiR2], b = RANK_IDX[loR2];
        const out = [];
        for (let i = Math.min(a,b); i <= Math.max(a,b); i++) {
            if (RANKS[i] !== r1) out.push(r1 + RANKS[i] + 'o');
        }
        return out;
    }

    function normalizeHand(h) {
        h = h.trim();
        if (!h) return null;
        let s = h.toUpperCase();
        if (s.endsWith('S')) s = s.slice(0,-1) + 's';
        else if (s.endsWith('O')) s = s.slice(0,-1) + 'o';
        if (s.length < 2 || s.length > 3) return null;
        if (!RANK_IDX.hasOwnProperty(s[0]) || !RANK_IDX.hasOwnProperty(s[1])) return null;
        return s;
    }

    function parseToken(raw) {
        raw = raw.trim();
        if (!raw) return [];

        let freq = 100;
        // Check :freq or [freq]
        const cIdx = raw.lastIndexOf(':');
        const bIdx = raw.indexOf('[');
        if (cIdx > 0) {
            const v = parseFloat(raw.slice(cIdx + 1));
            if (!isNaN(v)) { freq = Math.max(0, Math.min(100, v)); raw = raw.slice(0, cIdx); }
        } else if (bIdx > 0) {
            const v = parseFloat(raw.slice(bIdx+1));
            if (!isNaN(v)) { freq = Math.max(0, Math.min(100, v)); raw = raw.slice(0, bIdx); }
        }

        const dash = raw.indexOf('-');
        if (dash > 0) {
            const s = raw.slice(0, dash), e = raw.slice(dash + 1);
            const sn = normalizeHand(s), en = normalizeHand(e);
            if (!sn || !en) return [];

            if (sn.length === 2 && en.length === 2 && sn[0] === sn[1] && en[0] === en[1]) {
                return expandPairs(sn[0], en[0]).map(h => ({hand:h, freq}));
            }
            if (sn.endsWith('s') && en.endsWith('s') && sn[0] === en[0]) {
                return expandSuited(sn[0], sn[1], en[1]).map(h => ({hand:h, freq}));
            }
            if (sn.endsWith('o') && en.endsWith('o') && sn[0] === en[0]) {
                return expandOffsuit(sn[0], sn[1], en[1]).map(h => ({hand:h, freq}));
            }
            return [];
        }

        const n = normalizeHand(raw);
        return n ? [{hand: n, freq}] : [];
    }

    function parseRangeText(text) {
        const results = {};
        const tokens = text.replace(/\n/g, ',').split(',');
        for (const t of tokens) {
            for (const {hand, freq} of parseToken(t)) {
                results[hand] = freq;
            }
        }
        return results;
    }

    // ─── Colors ───
    const C_RAISE = [192, 57, 43];
    const C_CALL  = [39, 174, 96];
    const C_FOLD  = [24, 24, 40];

    function cellBg(a) {
        const r = a.r < 3 ? 0 : Math.round(a.r);
        const c = a.c < 3 ? 0 : Math.round(a.c);

        if (r === 0 && c === 0) return `rgb(${C_FOLD})`;
        if (c === 0) {
            if (r >= 100) return `rgb(${C_RAISE})`;
            return `linear-gradient(to right, rgb(${C_RAISE}) 0%, rgb(${C_RAISE}) ${r}%, rgb(${C_FOLD}) ${r}%, rgb(${C_FOLD}) 100%)`;
        }
        if (r === 0) {
            if (c >= 100) return `rgb(${C_CALL})`;
            return `linear-gradient(to right, rgb(${C_CALL}) 0%, rgb(${C_CALL}) ${c}%, rgb(${C_FOLD}) ${c}%, rgb(${C_FOLD}) 100%)`;
        }
        const f = Math.max(0, 100 - r - c);
        let grad = `rgb(${C_RAISE}) 0%, rgb(${C_RAISE}) ${r}%, rgb(${C_CALL}) ${r}%, rgb(${C_CALL}) ${r+c}%`;
        if (f > 0) grad += `, rgb(${C_FOLD}) ${r+c}%, rgb(${C_FOLD}) 100%`;
        return `linear-gradient(to right, ${grad})`;
    }

    // ─── Flow State ───
    let flow = {
        phase: 'rfi_walk',
        activeIdx: 0,
        openerIdx: -1,
        threeBettorIdx: -1,
        fourBettorIdx: -1,
        fiveBettorIdx: -1,
        actions: {},
        actedPhase: {},
        displayActions: {},
        displayPhase: {}
    };

    function resetFlow(startIdx) {
        flow = {
            phase: 'rfi_walk',
            activeIdx: startIdx || 0,
            openerIdx: -1,
            threeBettorIdx: -1,
            fourBettorIdx: -1,
            fiveBettorIdx: -1,
            actions: {},
            actedPhase: {},
            displayActions: {},
            displayPhase: {}
        };
        for (let i = 0; i < (startIdx || 0); i++) {
            flow.actions[ALL_POS[i]] = 'fold';
            flow.actedPhase[ALL_POS[i]] = 'rfi_walk';
            flow.displayActions[ALL_POS[i]] = 'fold';
            flow.displayPhase[ALL_POS[i]] = 'rfi_walk';
        }
        syncFlowToState();
    }

    function syncFlowToState() {
        const active = ALL_POS[flow.activeIdx] || 'UTG';
        if (flow.phase === 'rfi_walk') {
            state.scenario = 'rfi';
            state.position = active;
        } else if (flow.phase === 'facing_open') {
            state.scenario = 'vs_open';
            state.openerPos = ALL_POS[flow.openerIdx];
            state.responderPos = active;
        } else if (flow.phase === 'facing_3bet') {
            state.scenario = 'vs_3bet';
            state.openerPos = ALL_POS[flow.threeBettorIdx];
            state.responderPos = active;
        } else if (flow.phase === 'facing_4bet') {
            state.scenario = 'vs_4bet';
            state.openerPos = ALL_POS[flow.fourBettorIdx];
            state.responderPos = active;
        } else if (flow.phase === 'facing_5bet') {
            state.scenario = 'vs_5bet';
            state.openerPos = ALL_POS[flow.fiveBettorIdx] || ALL_POS[flow.threeBettorIdx];
            state.responderPos = active;
        }
        const lbl = document.getElementById('scenarioLabel');
        if (lbl) lbl.textContent = SCENARIOS[state.scenario].label;
    }

    function nextUnacted(startIdx) {
        for (let i = startIdx; i < ALL_POS.length; i++) {
            if (!flow.actions[ALL_POS[i]]) return i;
        }
        return -1;
    }

    function nextAfter3bet(fromIdx) {
        for (let i = fromIdx; i < ALL_POS.length; i++) {
            if (!flow.actions[ALL_POS[i]]) return i;
        }
        for (let i = 0; i < flow.threeBettorIdx; i++) {
            if (!flow.actions[ALL_POS[i]]) return i;
        }
        return -1;
    }

    function getPhaseActions(phase, posIdx) {
        if (phase === 'rfi_walk') return POS_CONFIG[ALL_POS[posIdx]].rfiActions;
        if (phase === 'facing_open') return ['Fold', 'Call', '3-Bet'];
        if (phase === 'facing_3bet') return ['Fold', 'Call', '4-Bet'];
        if (phase === 'facing_4bet') return ['Fold', 'Call', '5-Bet All-In'];
        if (phase === 'facing_5bet') return ['Fold', 'Call'];
        return [];
    }

    function nextAfter4bet(fromIdx) {
        for (let i = fromIdx; i < ALL_POS.length; i++) {
            if (i === flow.threeBettorIdx) continue;
            if (!flow.actions[ALL_POS[i]]) return i;
        }
        for (let i = 0; i < flow.fourBettorIdx; i++) {
            if (i === flow.threeBettorIdx) continue;
            if (!flow.actions[ALL_POS[i]]) return i;
        }
        return -1;
    }

    function nextAfter5bet(fromIdx, fiveBettorIdx) {
        for (let i = fromIdx; i < ALL_POS.length; i++) {
            if (i === flow.fourBettorIdx) continue;
            if (!flow.actions[ALL_POS[i]]) return i;
        }
        for (let i = 0; i < fiveBettorIdx; i++) {
            if (i === flow.fourBettorIdx) continue;
            if (!flow.actions[ALL_POS[i]]) return i;
        }
        return -1;
    }

    function handleFlowAction(action) {
        const pos = ALL_POS[flow.activeIdx];
        flow.actions[pos] = action;
        flow.actedPhase[pos] = flow.phase;
        flow.displayActions[pos] = action;
        flow.displayPhase[pos] = flow.phase;

        if (flow.phase === 'rfi_walk') {
            if (action === 'fold') {
                const nxt = nextUnacted(flow.activeIdx + 1);
                if (nxt === -1 || nxt >= 5) {
                    flow.phase = 'done';
                } else {
                    flow.activeIdx = nxt;
                }
            } else {
                flow.openerIdx = flow.activeIdx;
                const nxt = nextUnacted(flow.activeIdx + 1);
                if (nxt === -1) {
                    flow.phase = 'done';
                } else {
                    flow.activeIdx = nxt;
                    flow.phase = 'facing_open';
                }
            }
        } else if (flow.phase === 'facing_open') {
            if (action === 'fold' || action === 'call') {
                const nxt = nextUnacted(flow.activeIdx + 1);
                if (nxt === -1) {
                    flow.phase = 'done';
                } else {
                    flow.activeIdx = nxt;
                }
            } else if (action === '3bet') {
                flow.threeBettorIdx = flow.activeIdx;
                flow.phase = 'facing_3bet';
                flow.actions[ALL_POS[flow.openerIdx]] = undefined;
                for (let i = 0; i < ALL_POS.length; i++) {
                    if (flow.actions[ALL_POS[i]] === 'call') {
                        flow.actions[ALL_POS[i]] = undefined;
                    }
                }
                const nxt = nextAfter3bet(flow.activeIdx + 1);
                if (nxt === -1) {
                    flow.phase = 'done';
                } else {
                    flow.activeIdx = nxt;
                }
            }
        } else if (flow.phase === 'facing_3bet') {
            if (action === 'fold' || action === 'call') {
                let nxt = -1;
                if (flow.activeIdx >= flow.threeBettorIdx) {
                    nxt = nextAfter3bet(flow.activeIdx + 1);
                } else {
                    for (let i = flow.activeIdx + 1; i < flow.threeBettorIdx; i++) {
                        if (!flow.actions[ALL_POS[i]]) { nxt = i; break; }
                    }
                }
                if (nxt === -1) {
                    flow.phase = 'done';
                } else {
                    flow.activeIdx = nxt;
                }
            } else if (action === '4bet') {
                flow.fourBettorIdx = flow.activeIdx;
                flow.phase = 'facing_4bet';
                flow.actions[ALL_POS[flow.threeBettorIdx]] = undefined;
                for (let i = 0; i < ALL_POS.length; i++) {
                    if (i === flow.fourBettorIdx) continue;
                    if (flow.actions[ALL_POS[i]] === 'call') {
                        flow.actions[ALL_POS[i]] = undefined;
                    }
                }
                const nxt = nextAfter4bet(flow.activeIdx + 1);
                if (nxt === -1) {
                    flow.activeIdx = flow.threeBettorIdx;
                } else {
                    flow.activeIdx = nxt;
                }
            }
        } else if (flow.phase === 'facing_4bet') {
            if (action === '5bet') {
                flow.fiveBettorIdx = flow.activeIdx;
                flow.phase = 'facing_5bet';
                flow.actions[ALL_POS[flow.fourBettorIdx]] = undefined;
                for (let i = 0; i < ALL_POS.length; i++) {
                    if (i === flow.fiveBettorIdx) continue;
                    if (flow.actions[ALL_POS[i]] === 'call') {
                        flow.actions[ALL_POS[i]] = undefined;
                    }
                }
                const nxt = nextAfter5bet(flow.fiveBettorIdx + 1, flow.fiveBettorIdx);
                if (nxt === -1) {
                    flow.activeIdx = flow.fourBettorIdx;
                } else {
                    flow.activeIdx = nxt;
                }
            } else if (action === 'fold' || action === 'call') {
                if (flow.activeIdx === flow.threeBettorIdx) {
                    flow.phase = 'done';
                } else {
                    const nxt = nextAfter4bet(flow.activeIdx + 1);
                    if (nxt === -1) {
                        flow.activeIdx = flow.threeBettorIdx;
                    } else {
                        flow.activeIdx = nxt;
                    }
                }
            }
        } else if (flow.phase === 'facing_5bet') {
            if (action === 'fold' || action === 'call') {
                if (flow.activeIdx === flow.fourBettorIdx) {
                    flow.phase = 'done';
                } else {
                    const nxt = nextAfter5bet(flow.activeIdx + 1, flow.fiveBettorIdx);
                    if (nxt === -1) {
                        flow.activeIdx = flow.fourBettorIdx;
                    } else {
                        flow.activeIdx = nxt;
                    }
                }
            }
        }

        syncFlowToState();
        render();
    }

    function getFlowDescription() {
        const active = ALL_POS[flow.activeIdx] || '';
        const opener = ALL_POS[flow.openerIdx] || '';
        if (flow.phase === 'rfi_walk') {
            return `${active} to act — Open or Fold`;
        } else if (flow.phase === 'facing_open') {
            return `${active} facing ${opener} Open`;
        } else if (flow.phase === 'facing_3bet') {
            const threeBettor = ALL_POS[flow.threeBettorIdx];
            if (flow.activeIdx === flow.openerIdx) {
                return `${active} facing ${threeBettor} 3-Bet (you opened)`;
            }
            return `${active} cold vs ${threeBettor} 3-Bet (${opener} opened)`;
        } else if (flow.phase === 'facing_4bet') {
            const fourBettor = ALL_POS[flow.fourBettorIdx];
            if (flow.activeIdx === flow.threeBettorIdx) {
                return `${active} facing ${fourBettor} 4-Bet (you 3-bet)`;
            }
            return `${active} cold vs ${fourBettor} 4-Bet`;
        } else if (flow.phase === 'facing_5bet') {
            const fiveBettor = ALL_POS[flow.fiveBettorIdx] || ALL_POS[flow.threeBettorIdx];
            if (flow.activeIdx === flow.fourBettorIdx) {
                return `${active} facing ${fiveBettor} 5-Bet All-In (you 4-bet)`;
            }
            return `${active} facing ${fiveBettor} 5-Bet All-In`;
        }
        return 'Action complete — click Reset Table to start over';
    }

    function getActiveActions() {
        if (flow.phase === 'rfi_walk') {
            const cfg = POS_CONFIG[ALL_POS[flow.activeIdx]];
            return cfg.rfiActions;
        } else if (flow.phase === 'facing_open') {
            return ['Fold', 'Call', '3-Bet'];
        } else if (flow.phase === 'facing_3bet') {
            return ['Fold', 'Call', '4-Bet'];
        } else if (flow.phase === 'facing_4bet') {
            return ['Fold', 'Call', '5-Bet All-In'];
        } else if (flow.phase === 'facing_5bet') {
            return ['Fold', 'Call'];
        }
        return [];
    }

    function mapActionLabel(label) {
        const l = label.toLowerCase();
        if (l === 'fold') return 'fold';
        if (l === 'call') return 'call';
        if (l.includes('5-bet') || l.includes('5bet')) return '5bet';
        if (l.includes('3-bet') || l.includes('3bet')) return '3bet';
        if (l.includes('4-bet') || l.includes('4bet')) return '4bet';
        if (l.includes('allin') || l.includes('all-in') || l.includes('all in')) return 'allin';
        return 'raise';
    }

    function actionBtnClass(label) {
        const l = label.toLowerCase();
        if (l === 'fold') return 'fa-fold';
        if (l === 'call') return 'fa-call';
        if (l.includes('allin') || l.includes('all-in') || l.includes('all in')) return 'fa-allin';
        if (l.includes('5-bet') || l.includes('5bet')) return 'fa-allin';
        return 'fa-raise';
    }

    // ─── Render: Flow Bar ───
    function renderFlowBar() {
        const el = document.getElementById('flowText');
        if (el) el.textContent = getFlowDescription();
    }

    // ─── Render: Position Cards (flow-driven) ───
    function actionSelectedClass(actionLabel, selectedAction) {
        const mapped = mapActionLabel(actionLabel);
        if (mapped !== selectedAction) return '';
        if (mapped === 'fold') return 'selected-fold';
        if (mapped === 'call') return 'selected-call';
        if (mapped === 'allin') return 'selected-allin';
        if (mapped === '5bet') return 'selected-5bet';
        if (mapped === '3bet') return 'selected-3bet';
        if (mapped === '4bet') return 'selected-4bet';
        return 'selected-raise';
    }

    function renderPositions() {
        const el = document.getElementById('positionSelector');
        if (!el) return;

        let html = '<div class="pos-cards-row">';
        for (let i = 0; i < ALL_POS.length; i++) {
            const p = ALL_POS[i];
            const cfg = POS_CONFIG[p];
            const dispAct = flow.displayActions[p];
            const dispPhase = flow.displayPhase[p];
            const isFolded = (dispAct === 'fold');
            const isActive = (flow.phase !== 'done' && flow.activeIdx === i);
            const actedThisPhase = (flow.actedPhase[p] === flow.phase);

            let cardClass = 'pos-card';
            if (isActive) {
                cardClass += ' active';
            } else if (isFolded) {
                cardClass += ' acted';
            } else if (dispAct) {
                cardClass += ' acted';
            } else {
                cardClass += ' waiting';
            }

            html += `<div class="${cardClass}" data-idx="${i}">`;
            html += `<div class="pos-card-header">
                <span class="pos-card-name">${p}</span>
                <span class="pos-card-stack">${cfg.stack}</span>
            </div>`;

            if (isActive) {
                const actions = getActiveActions();
                html += '<div class="pos-card-actions">';
                for (const a of actions) {
                    html += `<button class="flow-action-btn ${actionBtnClass(a)}" data-flow-action="${mapActionLabel(a)}">${a}</button>`;
                }
                html += '</div>';
            } else if (isFolded && dispPhase) {
                const phaseActions = getPhaseActions(dispPhase, i);
                html += '<div class="pos-card-actions">';
                for (const a of phaseActions) {
                    const selClass = actionSelectedClass(a, 'fold');
                    html += `<div class="action-row-item ${selClass}">${a}</div>`;
                }
                html += '</div>';
            } else if (flow.phase !== 'done') {
                if (actedThisPhase && flow.actions[p]) {
                    const currentActions = getPhaseActions(flow.phase, i);
                    html += '<div class="pos-card-actions">';
                    for (const a of currentActions) {
                        const selClass = actionSelectedClass(a, flow.actions[p]);
                        html += `<div class="action-row-item ${selClass}">${a}</div>`;
                    }
                    html += '</div>';
                } else if (dispAct && dispPhase) {
                    const prevActions = getPhaseActions(dispPhase, i);
                    html += '<div class="pos-card-actions">';
                    for (const a of prevActions) {
                        const selClass = actionSelectedClass(a, dispAct);
                        html += `<div class="action-row-item ${selClass}">${a}</div>`;
                    }
                    html += '</div>';
                } else {
                    const currentActions = getPhaseActions(flow.phase, i);
                    html += '<div class="pos-card-actions">';
                    for (const a of currentActions) {
                        html += `<div class="action-row-item" style="opacity:0.25">${a}</div>`;
                    }
                    html += '</div>';
                }
            } else {
                if (dispAct && dispPhase) {
                    const phaseActions = getPhaseActions(dispPhase, i);
                    html += '<div class="pos-card-actions">';
                    for (const a of phaseActions) {
                        const selClass = actionSelectedClass(a, dispAct);
                        html += `<div class="action-row-item ${selClass}">${a}</div>`;
                    }
                    html += '</div>';
                } else {
                    const defaultActions = cfg.rfiActions;
                    html += '<div class="pos-card-actions">';
                    for (const a of defaultActions) {
                        html += `<div class="action-row-item" style="opacity:0.25">${a}</div>`;
                    }
                    html += '</div>';
                }
            }

            html += '</div>';
        }
        html += '</div>';
        el.innerHTML = html;

        el.querySelectorAll('.flow-action-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                handleFlowAction(btn.dataset.flowAction);
            });
        });

        el.querySelectorAll('.pos-card:not(.active)').forEach(card => {
            card.addEventListener('click', () => {
                const idx = parseInt(card.dataset.idx);
                if (idx >= 0 && idx <= 4) {
                    resetFlow(idx);
                    render();
                }
            });
        });
    }

    // ─── Render: Matrix ───
    function renderMatrix() {
        const el = document.getElementById('matrixContainer');
        if (!el) return;

        const rng = currentRange();
        const hasData = Object.keys(rng).length > 0;

        if (!hasData && state.scenario !== 'rfi') {
            el.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-file-import"></i>
                    <p><strong>No range data for this spot</strong></p>
                    <p>Import a range from GTO Wizard or add it manually via Edit mode</p>
                    <button class="btn-action btn-import" onclick="document.getElementById('importModal').style.display='flex'">
                        <i class="fas fa-file-import"></i> Import Range
                    </button>
                </div>`;
            return;
        }

        const sc = SCENARIOS[state.scenario];
        let html = '<div class="matrix-grid">';
        for (let i = 0; i < 13; i++) {
            html += '<div class="matrix-row">';
            for (let j = 0; j < 13; j++) {
                const h = handName(i, j);
                const a = handActions(h);
                const bg = cellBg(a);
                const ec = state.editMode ? ' editable' : '';
                const played = a.r + a.c;
                const alpha = played > 50 ? 1 : (played > 0 ? 0.85 : 0.5);

                let tip = h;
                if (state.scenario === 'rfi') {
                    tip += `: Raise ${a.r.toFixed(0)}%`;
                } else {
                    tip += `: ${sc.aggressive} ${a.r.toFixed(0)}%, ${sc.passive} ${a.c.toFixed(0)}%, Fold ${a.f.toFixed(0)}%`;
                }

                html += `<div class="matrix-cell${ec}" style="background:${bg}" data-hand="${h}" title="${tip}">`;
                html += `<span class="cell-label" style="opacity:${alpha}">${h}</span>`;
                if (state.editMode) {
                    html += `<input type="number" class="freq-input" value="${a.r}" min="0" max="100" step="1" data-hand="${h}" data-act="r">`;
                }
                html += '</div>';
            }
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="range-legend">';
        html += `<div class="legend-item"><div class="legend-dot" style="background:rgb(${C_RAISE})"></div>${sc.aggressive}</div>`;
        if (sc.passive) {
            html += `<div class="legend-item"><div class="legend-dot" style="background:rgb(${C_CALL})"></div>${sc.passive}</div>`;
        }
        html += `<div class="legend-item"><div class="legend-dot" style="background:rgb(${C_FOLD})"></div>Fold</div>`;
        html += '</div>';

        el.innerHTML = html;

        if (state.editMode) {
            el.querySelectorAll('.freq-input').forEach(inp => {
                inp.addEventListener('change', onFreqChange);
                inp.addEventListener('click', e => e.stopPropagation());
            });
        }
    }

    function onFreqChange(e) {
        const hand = e.target.dataset.hand;
        const val = Math.max(0, Math.min(100, parseFloat(e.target.value) || 0));
        const bucket = rangeData[state.scenario];
        const key = rangeKey();
        if (!bucket[key]) bucket[key] = {};

        if (state.scenario === 'rfi') {
            bucket[key][hand] = val;
        } else {
            if (!bucket[key][hand]) bucket[key][hand] = {r:0, c:0};
            bucket[key][hand].r = val;
        }
        renderMatrix();
        renderInfo();
    }

    // ─── Render: Info Panel ───
    function renderInfo() {
        const el = document.getElementById('infoContent');
        if (!el) return;

        document.querySelectorAll('#rangesApp .info-tab').forEach(t => {
            t.classList.toggle('active', t.dataset.tab === state.infoTab);
        });

        if (state.infoTab === 'actions') renderActions(el);
        else renderHandList(el);
    }

    function renderActions(el) {
        const st = calcStats();
        const sc = SCENARIOS[state.scenario];
        let html = '<div class="action-summary">';

        html += `<div class="action-row">
            <div class="action-color" style="background:rgb(${C_RAISE})"></div>
            <span class="action-name">${sc.aggressive}</span>
            <span class="action-pct">${st.raisePct.toFixed(1)}%</span>
            <span class="action-combos">${st.raise.toFixed(1)} combos</span>
        </div>`;

        if (sc.passive) {
            html += `<div class="action-row">
                <div class="action-color" style="background:rgb(${C_CALL})"></div>
                <span class="action-name">${sc.passive}</span>
                <span class="action-pct">${st.callPct.toFixed(1)}%</span>
                <span class="action-combos">${st.call.toFixed(1)} combos</span>
            </div>`;
        }

        html += `<div class="action-row">
            <div class="action-color" style="background:rgb(${C_FOLD})"></div>
            <span class="action-name">Fold</span>
            <span class="action-pct">${st.foldPct.toFixed(1)}%</span>
            <span class="action-combos">${st.fold.toFixed(1)} combos</span>
        </div>`;

        html += '</div>';
        html += `<div class="stats-footer">
            Total: ${st.total} combos &nbsp;·&nbsp; Playing: ${(st.raisePct + st.callPct).toFixed(1)}%
        </div>`;

        el.innerHTML = html;
    }

    function renderHandList(el) {
        const sc = SCENARIOS[state.scenario];
        const hands = [];
        for (let i = 0; i < 13; i++) {
            for (let j = 0; j < 13; j++) {
                const h = handName(i, j);
                const a = handActions(h);
                if (a.r > 0 || a.c > 0) {
                    hands.push({ hand: h, r: a.r, c: a.c, total: a.r + a.c });
                }
            }
        }
        hands.sort((a, b) => b.total - a.total || b.r - a.r);

        if (!hands.length) {
            el.innerHTML = '<div style="text-align:center;color:#4a4a5a;padding:2.5rem 1rem;">No hands in range</div>';
            return;
        }

        let html = '<div class="hand-list">';
        for (const h of hands) {
            html += `<div class="hand-list-row">
                <span class="hl-hand">${h.hand}</span>
                <div class="hl-bar">
                    <div class="hl-raise" style="width:${h.r}%;background:rgb(${C_RAISE})"></div>
                    <div class="hl-call" style="width:${h.c}%;background:rgb(${C_CALL})"></div>
                </div>
                <span class="hl-pct">${h.total}%</span>
            </div>`;
        }
        html += '</div>';
        el.innerHTML = html;
    }

    // ─── Import / Export ───
    function openImport() {
        const ag = document.getElementById('importActionGroup');
        ag.style.display = state.scenario === 'rfi' ? 'none' : 'block';
        document.getElementById('importText').value = '';
        document.getElementById('importPreview').innerHTML = '';
        document.getElementById('importApplyBtn').disabled = true;
        document.getElementById('importModal').style.display = 'flex';
    }

    function previewImport() {
        const text = document.getElementById('importText').value;
        const parsed = parseRangeText(text);
        const count = Object.keys(parsed).length;
        const preview = document.getElementById('importPreview');
        const applyBtn = document.getElementById('importApplyBtn');

        if (!count) {
            preview.innerHTML = '<span style="color:#e74c3c;">No valid hands found. Check the format and try again.</span>';
            applyBtn.disabled = true;
            return;
        }

        const sorted = Object.entries(parsed).sort((a,b) => b[1] - a[1]);
        const sample = sorted.slice(0, 25).map(([h,f]) => f < 100 ? `${h}:${f}` : h).join(', ');
        const more = count > 25 ? ` … +${count-25} more` : '';
        preview.innerHTML = `<span style="color:#27ae60;">&#10003; ${count} hands parsed</span><br>${sample}${more}`;
        applyBtn.disabled = false;
    }

    function applyImport() {
        const text = document.getElementById('importText').value;
        const parsed = parseRangeText(text);
        const action = state.scenario === 'rfi' ? 'r' :
            (document.querySelector('input[name="importAction"]:checked')?.value || 'r');

        const bucket = rangeData[state.scenario];
        const key = rangeKey();
        if (!bucket[key]) bucket[key] = {};

        for (const [hand, freq] of Object.entries(parsed)) {
            if (state.scenario === 'rfi') {
                bucket[key][hand] = freq;
            } else {
                if (!bucket[key][hand]) bucket[key][hand] = {r:0, c:0};
                bucket[key][hand][action] = freq;
            }
        }

        document.getElementById('importModal').style.display = 'none';
        render();
    }

    function exportRange() {
        const rng = currentRange();
        const parts = [];

        for (let i = 0; i < 13; i++) {
            for (let j = 0; j < 13; j++) {
                const h = handName(i, j);
                const a = handActions(h);
                if (state.scenario === 'rfi') {
                    if (a.r === 100) parts.push(h);
                    else if (a.r > 0) parts.push(`${h}:${a.r}`);
                } else {
                    if (a.r > 0 || a.c > 0) {
                        parts.push(`${h}:${a.r}/${a.c}`);
                    }
                }
            }
        }

        const text = parts.join(',');
        if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(() => flashBtn('exportBtn', 'Copied!')).catch(() => prompt('Copy this range:', text));
        } else {
            prompt('Copy this range:', text);
        }
    }

    function flashBtn(id, msg) {
        const btn = document.getElementById(id);
        if (!btn) return;
        const orig = btn.innerHTML;
        btn.innerHTML = `<i class="fas fa-check"></i> ${msg}`;
        setTimeout(() => btn.innerHTML = orig, 1800);
    }

    // ─── Edit Mode & Persistence ───
    function toggleEdit() {
        state.editMode = !state.editMode;
        const btn = document.getElementById('editToggle');
        btn.classList.toggle('active', state.editMode);
        btn.innerHTML = state.editMode
            ? '<i class="fas fa-times"></i> Exit Edit'
            : '<i class="fas fa-edit"></i> Edit';
        document.getElementById('saveBtn').style.display = state.editMode ? '' : 'none';
        document.getElementById('resetBtn').style.display = state.editMode ? '' : 'none';
        renderMatrix();
    }

    function saveLocal() {
        try {
            localStorage.setItem('pokerRangesV2', JSON.stringify(rangeData));
            flashBtn('saveBtn', 'Saved!');
        } catch (e) {
            alert('Failed to save: ' + e.message);
        }
    }

    function loadLocal() {
        try {
            const raw = localStorage.getItem('pokerRangesV2');
            if (!raw) return;
            const saved = JSON.parse(raw);
            for (const sc of ['rfi','vs_open','vs_3bet']) {
                if (saved[sc]) {
                    for (const key of Object.keys(saved[sc])) {
                        rangeData[sc][key] = saved[sc][key];
                    }
                }
            }
        } catch (e) {
            console.error('Failed to load saved ranges:', e);
        }
    }

    function resetAll() {
        if (!confirm('Reset ALL ranges to defaults? This removes any imported or edited data.')) return;
        rangeData = JSON.parse(JSON.stringify(originalData));
        localStorage.removeItem('pokerRangesV2');
        render();
    }

    // ─── Master Render ───
    function render() {
        renderFlowBar();
        renderPositions();
        renderMatrix();
        renderInfo();
    }

    // ─── Init ───
    document.addEventListener('DOMContentLoaded', () => {
        loadLocal();
        resetFlow(0);

        document.getElementById('resetFlowBtn').addEventListener('click', () => {
            resetFlow(0);
            render();
        });

        document.querySelectorAll('#rangesApp .info-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                state.infoTab = tab.dataset.tab;
                renderInfo();
            });
        });

        document.getElementById('importBtn').addEventListener('click', openImport);
        document.getElementById('exportBtn').addEventListener('click', exportRange);
        document.getElementById('editToggle').addEventListener('click', toggleEdit);
        document.getElementById('saveBtn').addEventListener('click', saveLocal);
        document.getElementById('resetBtn').addEventListener('click', resetAll);

        document.getElementById('importClose').addEventListener('click', () => {
            document.getElementById('importModal').style.display = 'none';
        });
        document.getElementById('importParseBtn').addEventListener('click', previewImport);
        document.getElementById('importApplyBtn').addEventListener('click', applyImport);

        document.getElementById('importModal').addEventListener('click', e => {
            if (e.target === e.currentTarget) e.target.style.display = 'none';
        });

        render();
    });
})();
</script>
