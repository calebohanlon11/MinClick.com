{% extends "base.html" %}
{% block title %}Login - Min-Click.com{% endblock %}
{% block content %}
<style>
    .auth-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 60vh;
        padding: 2rem 0;
    }
    .auth-card {
        background: var(--gradient-card);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 2.5rem;
        width: 100%;
        max-width: 420px;
        box-shadow: var(--shadow);
    }
    .auth-card h3 {
        font-weight: 700;
        text-align: center;
        margin-bottom: 0.5rem;
    }
    .auth-card .auth-sub {
        text-align: center;
        color: var(--text-secondary);
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
    }
    .auth-card label {
        font-weight: 500;
        font-size: 0.85rem;
        color: var(--text-secondary);
        margin-bottom: 0.3rem;
        margin-top: 0.8rem;
        display: block;
    }
    .auth-card .form-control {
        padding: 0.6rem 0.9rem;
    }
    .auth-card .btn-primary {
        width: 100%;
        padding: 0.65rem;
        margin-top: 1.5rem;
        font-size: 1rem;
    }
</style>
<div class="auth-wrapper">
    <div class="auth-card">
        <h3><i class="fas fa-sign-in-alt me-2" style="color:var(--accent-green)"></i>Login</h3>
        <p class="auth-sub">Sign in to your analytics dashboard</p>
        <form method="POST">
            <label for="email">Email Address</label>
            <input type="text" id="email" name="email" class="form-control" placeholder="you@example.com" />
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter Password" />
            <button class="btn btn-primary" type="submit"><i class="fas fa-arrow-right me-1"></i>Login</button>
        </form>
    </div>
</div>
{% endblock %}
